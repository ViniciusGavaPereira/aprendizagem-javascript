
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso não encontrado</title>


    <style>

        /* =================================
           1. Configurações gerais
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            background: #f4f6fb;
            color: #1c2740;

            font-family: Inter, Arial, sans-serif;
        }


        /* =================================
           2. Container principal
        ================================= */

        .box {
            width: min(100%, 560px);

            background: #fff;

            border: 1px solid #e8ebf2;
            border-radius: 20px;

            padding: 48px;

            text-align: center;

            box-shadow: 0 18px 55px #18264a12;
        }


        /* =================================
           3. Ícone de alerta
        ================================= */

        .symbol {
            width: 76px;
            height: 76px;

            border-radius: 50%;

            display: grid;
            place-items: center;

            background: #fff1e9;
            color: #d66b32;

            font-size: 34px;
            font-weight: 800;

            margin: 0 auto 24px;
        }


        /* =================================
           4. Título da página
        ================================= */

        h1 {
            font-size: 27px;

            margin: 0 0 14px;
        }


        /* =================================
           5. Mensagem de orientação
        ================================= */

        .message {
            color: #738097;

            line-height: 1.65;

            margin: 0 auto 28px;

            max-width: 420px;
        }


        /* =================================
           6. Código do erro
        ================================= */

        .code {
            font-size: 12px;
            color: #9aa3b3;

            margin-bottom: 28px;
        }


        /* =================================
           7. Área dos botões
        ================================= */

        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        /* Configuração geral dos links */

        a {
            padding: 13px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 700;
        }


        /* Botão de contato com suporte */

        .primary {
            background: #3157d5;
            color: #fff;
        }


        /* Botão de retorno ao login */

        .secondary {
            background: #eef1f7;
            color: #4d5a72;
        }


        /* =================================
           8. Responsividade
        ================================= */

        @media (max-width: 480px) {

            .box {
                padding: 32px 22px;
            }

        }

    </style>

</head>


<body>

    <!-- =================================
         Container principal
    ================================== -->

    <main class="box">


        <!-- Ícone de alerta -->

        <div class="symbol">
            !
        </div>


        <!-- Título do erro -->

        <h1>
            Acesso não encontrado
        </h1>


        <!-- Mensagem explicativa -->

        <p class="message">
            Não foi possível localizar uma permissão de acesso
            para esta página. Se você acredita que deveria ter
            acesso, entre em contato com o suporte da plataforma.
        </p>


        <!-- Identificação do erro -->

        <div class="code">
            ERRO 403 · ACESSO NÃO AUTORIZADO
        </div>


        <!-- Botões de navegação -->

        <div class="actions">


            <!-- Contato com suporte -->

            <a
                class="primary"
                href="mailto:suporte@empresa.com"
            >
                Entrar em contato com o suporte
            </a>


            <!-- Retornar para a página de login -->

            <a
                class="secondary"
                href="login.html"
            >
                Voltar ao login
            </a>

        </div>

    </main>

</body>

</html>
