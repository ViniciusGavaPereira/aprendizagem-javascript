
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/controller.js" type="module"></script>
    <title>Entrar | Portal</title>

    <style>

        /* =================================
           1. Variáveis de cores
        ================================= */

        :root {
            --primary: #3157d5;
            --dark: #172033;
            --muted: #68738a;
            --bg: #f3f5fa;
        }


        /* =================================
           2. Configurações gerais
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: var(--bg);
            color: var(--dark);

            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;
        }


        /* =================================
           3. Container do formulário
        ================================= */

        .login {
            width: min(100%, 420px);

            background: #fff;

            padding: 40px;
            border-radius: 20px;

            box-shadow: 0 18px 55px #18264a18;
        }


        /* =================================
           4. Identificação do portal
        ================================= */

        .brand {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;

            color: var(--primary);

            margin-bottom: 32px;
        }


        /* =================================
           5. Títulos e textos
        ================================= */

        h1 {
            font-size: 28px;
            margin: 0 0 8px;
        }

        .sub {
            color: var(--muted);

            margin: 0 0 28px;

            line-height: 1.5;
        }


        /* =================================
           6. Campos do formulário
        ================================= */

        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            margin: 18px 0 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #dce1eb;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }


        /* Efeito visual ao selecionar um campo */

        input:focus {
            border-color: var(--primary);

            box-shadow: 0 0 0 3px #3157d51a;
        }


        /* =================================
           7. Botão de login
        ================================= */

        button {
            width: 100%;

            border: 0;

            background: var(--primary);
            color: white;

            padding: 15px;

            border-radius: 10px;

            font-weight: 700;
            font-size: 15px;

            margin-top: 24px;

            cursor: pointer;
        }


        /* Efeito ao passar o mouse */

        button:hover {
            background: #2446b7;
        }


        /* =================================
           8. Links de ajuda
        ================================= */

        .help {
            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-top: 18px;

            font-size: 13px;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }


        /* =================================
           9. Rodapé
        ================================= */

        .foot {
            text-align: center;

            color: #929bad;

            font-size: 12px;

            margin-top: 32px;
        }

    </style>

</head>


<body>

    <!-- =================================
         Container principal de login
    ================================== -->

    <main class="login">


        <!-- Identificação do portal -->

        <div class="brand">
            PORTAL • ACESSO
        </div>


        <!-- Título e descrição -->

        <h1>
            Bem-vindo de volta
        </h1>

        <p class="sub">
            Entre com suas credenciais para acessar a plataforma.
        </p>


        <!-- Formulário de autenticação -->

        <form action="#" method="post" id="loginForm">


            <!-- Campo de e-mail -->

            <label for="email">
                E-mail corporativo
            </label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="nome@empresa.com"
                autocomplete="username"
                required
            >


            <!-- Campo de senha -->

            <label for="senha">
                Senha
            </label>

            <input
                id="senha"
                name="senha"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >


            <!-- Botão para enviar o formulário -->

            <button type="submit" >
                Entrar
            </button>

        </form>


        <!-- Links auxiliares -->

        <div class="help">

            <a href="#">
                Esqueci minha senha
            </a>

            <a href="suporte.html">
                Precisa de ajuda?
            </a>

        </div>


        <!-- Rodapé da página -->

        <div class="foot">
            © 2026 Portal. Todos os direitos reservados.
        </div>


    </main>

</body>

</html>
